# cross_sections.yaml — v2 pipeline M1/M2/M3 verification input.
#
# COORDS: map frame metres. Conversion to pgm pixel is done by the verifier:
#   px = (map_x - origin_x) / resolution
#   py = H - 1 - (map_y - origin_y) / resolution        (Nav2 flip)
#
# STATUS values:
#   real            — real coords entered; run the metric on this section.
#   placeholder     — SKIPPED with a warning (default; fill real coords).
#   not_applicable  — SKIPPED cleanly (feature does not exist on this
#                     campus / route). Reported as N/A, no warning.
#                     Example: ditch枠 on a route with no side drains.
#
# HOW TO PICK COORDS:
#   * Start GLIM viewer (offline_viewer or CloudCompare on static.pcd) and
#     read the (x, y) at a curb / wall / ditch you can visually identify.
#   * Cross-check against the corresponding pixel in occupancy_cleaned.pgm
#     using its origin/resolution.
#   * For line-shaped sections (M1, M2, M3), give a short line segment (5-15
#     m) that CROSSES the feature roughly perpendicular. For M1, also give
#     the expected_step_xy = the actual step position on that segment.

grid_yaml: final.yaml   # confirmed pgm with all sidecars applied (OCC≈435k after user paint + auto ≤3 cell)

m1_sections:
  - id: curb_west_road_01
    status: real
    start_xy: [16.95, 1.25]           # 道路側(南)
    end_xy:   [16.95, 7.25]           # 敷地側(北)
    expected_step_xy: [16.95, 4.25]   # pixel (2904, 4402)
    expected_side_kind: curb
    expected_step_height_m: 0.15
    description: "十字路西の直線区間、道路(南)/植栽敷地(北)境界。向きはfree_evidenceで確認済"

  - id: curb_west_road_02
    status: real
    start_xy: [3.80, 0.75]
    end_xy:   [3.80, 6.75]
    expected_step_xy: [3.80, 3.75]    # pixel (2640-2642, 4412) の中点
    expected_side_kind: curb
    expected_step_height_m: 0.15
    description: "同境界の西寄り地点"

  - id: curb_east_road_01
    status: real
    start_xy: [41.40, 2.25]
    end_xy:   [41.40, 8.25]
    expected_step_xy: [41.40, 5.25]   # pixel (3392-3394, 4382) の中点
    expected_side_kind: curb
    expected_step_height_m: 0.15
    description: "十字路東の道路、道路(南)/敷地(北)境界"

  # 側溝 (負障害物) — 2026-07-18 user 確認: 走行キャンパスに該当地形なし。
  # 実地検証は断念、代替として scripts/tests/test_step_accessible.py の
  # 合成標高マップ (curb / ditch / no-traj fallback / sub-threshold) で
  # Rule 3 chair-accessible-side 選択ロジックを assert する。
  - id: ditch_required_01
    status: not_applicable
    start_xy: [0.0, 0.0]
    end_xy:   [0.0, 5.0]
    expected_step_xy: [0.0, 2.5]
    expected_side_kind: ditch
    expected_step_height_m: 0.20
    description: "N/A: no ditch on campus route (user confirmed). See scripts/tests/test_step_accessible.py synthetic coverage."

m2_sections:
  - id: curb_line_west_road_01
    status: real
    start_xy: [-9.35, 3.85]           # pixel (2378, 4410) 西の円弧手前
    end_xy:   [20.00, 4.25]           # pixel (2965, 4402) 東の円弧手前
    expected_length_m: 29.4
    description: "十字路西の直線境界、両側の円弧を除いた連続区間"
# =====================================================================
# M3: 建物幅 (壁+庇, ±1 cell)
# =====================================================================
# IMPORTANT: 各セクションの線分は SINGLE BUILDING のみを串刺しにする
# 前提。もし複数建物を貫くと、first-OCCUPIED → last-OCCUPIED 距離は
# 「片端の外壁 → 反対端の建物の遠壁」の合成値となり無意味。建物ごとに
# 独立したセクションを立てること (道路を挟んで対向する 2 棟なら 2 sections)。
#
# For each section:
#   - start_xy と end_xy は当該建物の両側それぞれの外壁の OUTSIDE (道路上)
#   - 線分に沿って最初と最後の OCCUPIED cell の距離を測る
#   - Rule 3 (h=2.2m walkable clearance) により庇 (2.0-2.2m) も pgm に
#     現れるため、expected_width_m は「壁+庇」の実測値を書く
#     (CloudCompare で GLIM 点群を実測して確定)
#   - PASS if |measured - expected| ≤ resolution (5 cm)
m3_sections:
  - id: bldg_placeholder_01
    status: placeholder
    start_xy: [-10.0, 0.0]              # ← 建物の一方の外側 (道路上)
    end_xy:   [ 10.0, 0.0]              # ← 反対側の外側 (道路上、貫通)
    expected_width_m: 15.0              # ← 壁+庇の実測値 (m)
    description: "PLACEHOLDER: 建物幅測定の実座標に置換"
