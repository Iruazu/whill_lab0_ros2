# 名前付き配車地点 (M7 whill_dispatch)。
#
# ADR-0005 (maps 規約) の拡張。占有格子・PCD と同じ docs/maps/<site>/ 配下に
# 置き、localizer / Nav2 と同じ map frame 座標系を共有する。座標は map frame の
# メートル値で、occupancy_v2.yaml の origin [-128.25, -90.35, 0.0] と同一基準。
#
# 画素 (v2/final.pgm, 6640x6295) → map の変換:
#   x = -128.25 + (col + 0.5) * 0.05
#   y = -90.35  + (6295 - row - 0.5) * 0.05
#
# 2026-07-19 現地指定: bldg7 / bldg3 はユーザー指定の画素座標から変換し、
# 変換先が FREE (画素値 254 = 走行可能な道路上) であることを確認済み。
# 2026-07-22 更新: bldg7 を (1376, 4518) へ移動 (FREE 254 確認済)、seimon を
# (810, 4642) に新設 (UNKNOWN 205 — 白塗り待ち、下の個別コメント参照)。
# 変換式の小数第3位はちょうど 5 に乗ることが多い (画素中心 +0.5 のため)。
# 誤差 1 cm 未満なのでどちらに丸めてもよいが、本ファイルは切り捨て側
# (-59.425 → -59.42) で統一している。
# kounoken は mapping 発進点 (map 原点) で道路上。yaw は未測量のため 0.0 —
# 到着向きが問題になる場合のみ現地で /pcl_pose の yaw を実測して更新する。
# 差し替え後は dispatch_node (T3) を再起動すれば反映される (yaml は起動時に一度読む)。
frame_id: map
waypoints:
  # name: submit で参照する内部 ID (英数字)。label: UI 表示名。
  - name: kounoken       # M6R-2 live acceptance の発進地点 (工農研横)
    label: 工農研横
    x: 0.0               # [m] map 原点 = mapping 発進点 (道路上)
    y: 0.0
    yaw: 0.0             # [rad]
  - name: bldg7          # 画素 (1376, 4518) 指定 (2026-07-22。旧 (1940, 4500) から移動)
    label: 7号館前
    x: -59.42            # [m]
    y: -1.52
    yaw: 0.0
  - name: seimon         # 画素 (810, 4642) 指定 (2026-07-22)
    label: 正門前
    # 注意: この地点は 2026-07-22 時点で final.pgm 上 UNKNOWN (画素値 205、未白塗り)。
    # マーカー表示と submit 受付は可能だが、白塗り (走行可能化) が済むまで
    # Nav2 (allow_unknown:false) が経路を引けず ABORTED になる。
    x: -87.72            # [m]
    y: -7.72
    yaw: 0.0
  - name: bldg3          # 画素 (3920, 4440) 指定 (2026-07-19)
    label: 3号館前
    x: 67.78             # [m]
    y: 2.38
    yaw: 0.0
