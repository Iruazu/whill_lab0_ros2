# results: filled by ADR-0003 author after running m5r3_loop_error.py and
# CloudCompare wall-point picking. Schema matches the GLIM manifest so
# the two are line-by-line comparable.
results:
  loop_error_trajectory_m: dnf       # no trajectory file emitted
  loop_error_wall_3pt_m: dnf         # no PCD emitted, CloudCompare not possible
  notes: |
    DNF (Did Not Finish): FAST-LIO SAM exited silently within ~0.14 s
    of bag start, after a single "[WARN] No point, skip this scan!"
    on the first /velodyne_points frame. Subsequent ~199 s of bag
    replay went into a process that was no longer alive (rss.log
    flat 0, vram.log flat 15 MiB baseline, no further slam.log
    entries). No trajectory file, no keyframe PCDs, no global PCD —
    just the launch/preflight artifacts.

    Sequence captured in slam.log (full file is 8 lines):
      1. Multi thread started
      2. p_pre->lidar_type 2                       # Velodyne path picked up correctly
      3. ~~~~/home/systemlab/whill_lab0_ros2/src/third_party/FAST_LIO_SAM/ doesn't exist
         (FAST-LIO SAM's ROOT_DIR search; the directory DOES exist,
         so this is a path-construction bug in the upstream — likely
         a `realpath` / trailing-slash mismatch — not a user mis-config)
      4. Loop Closure Thread Start
      5. Multi thread started                      # second thread reports init
      6. LIO-SAM Backend Start
      7. [WARN] No point, skip this scan!         # first /velodyne_points rejected
      (silence; no SIGSEGV string flushed, consistent with destructor-
      free abort during preprocess after the empty-scan branch)

    What this run is NOT evidence for:
      * Not an IMU-sign issue: same bag (bag-imu-fixed) GLIM consumed
        successfully; FAST-LIO's own gravity self-estimation would
        have absorbed either sign anyway (legacy archaeologist
        finding: IMU_Processing.hpp:196).
      * Not an extrinsic mis-spec: the M4R-2 extrinsic in the launch
        is the same one GLIM used, and the warn appears in preprocess
        (lidar_type 2 path), BEFORE IMU integration would assert on
        extrinsic.
      * Not a missing-launch issue: launch resolved to the scripts/
        Velodyne mapping launch (commit 4af5ffa); the previous run
        crashed before this with the upstream-launch-missing error
        and is documented separately.

    What this run IS evidence for, going into ADR-0003:
      * FAST-LIO SAM's upstream ROS2 port has no Velodyne mapping
        launch shipped (only airy / l2 / mid360); the launch + config
        we wrote (scripts/m5r3_mapping_velodyne_for_fastlio_sam.launch
        .py + scripts/m5r3_fastlio_sam_velodyne_config.yaml) IS the
        minimum to get FAST-LIO SAM to even attempt Velodyne mapping,
        and even that lands in a preprocess crash on the first frame.
      * The ROOT_DIR path-construction bug surfaces immediately,
        suggesting other latent path / config issues that would
        require upstream-side debugging — out of scope for M5R-3.
      * GTSAM coexistence (4.3a0 in /usr/local + 4.1.1 in /usr/lib)
        loaded without ldconfig conflict per gtsam_env.log; that
        risk did NOT materialise here.

    Decision input: combined with the GLIM run that produced a clean
    1954-sample trajectory on the same bag with end-to-start drift
    0.838 m, the Phase B comparison is one-sided: GLIM ran, FAST-LIO
    SAM did not. Per user judgment (LiDAR class fit + work-cost cap),
    ADR-0003 closes with GLIM as the M5-R mapping SLAM.
