# Patchwork++ #2 for the avoidance baseline (docs/ja/plans/
# 2026-10-28-avoidance-baseline.md §2.1). Input is the Hi-Res-calibrated
# cloud (/velodyne_points_hires); output /perception/lidar_obstacles is
# relabelled to `velodyne_hires` so the measured mount TF applies.
#
# Only sensor_height and frame_id_override differ from patchworkpp.yaml
# (instance #1, which keeps feeding /scan, Layer C and the localizer path
# unchanged):
#   sensor_height 0.777: stage-A floor fit with Hi-Res elevations (plan
#     §1.1). #1 keeps 0.79 because its cloud is the VLP16db-distorted one.
#   min_range / max_range: same as #1 (body self-return standoff and the
#     obstacle_layer raytrace range) so both instances see the same window.

/**:
  ros__parameters:
    verbose:        false
    sensor_height:  0.777
    min_range:      1.0
    max_range:      25.0
    frame_id_override: velodyne_hires
    stats_log_period_frames: 100
