# Nav2 parameters for the WHILL CR2 chair.
#
# History: this file was drafted in M5-c as a conservative first-cut for
# indoor demo. M6R4-1 (Issue #80) points it at the M5-R campus map and
# retargets the topic plumbing at the M4-R EKF + M6R-3 lite twist_mux
# rather than FAST-LIO. M6R4-2 adds the obstacle layer. M6R4-b (PR #83,
# ADR-0011) drops in Patchwork++ ground removal upstream of p2ls. M6R4-c
# (PR #84) flips p2ls's input to the non-ground cloud and lands
# min_height 0.05 (ADR-0009 accepted). Task #13 (PR #88) supplies the
# salt-cleaned map via `map_variant:=cleaned`. **This M6R4-3 change
# flips use_collision_detection to true** — preconditions met, safety
# net expanded by failsafe Layer C (perception heartbeat).
#
# Topic plumbing (M6R-3 lite, ADR-0007 §4):
#   /odometry/filtered     <- ekf_filter_node (M4-R, 30 Hz odom -> base_link)
#   /map                   <- map_server below, docs/maps/<site>/occupancy.pgm
#   /pcl_pose              <- lidar_localization_ros2 (M6R-2, map -> odom)
#   /cmd_vel_nav           <- controller_server + behavior_server (Nav2 output)
#   /cmd_vel_safety        <- failsafe_node (M6R-3 lite, zero twist on divergence)
#   /cmd_vel               <- twist_mux (M6R-3 lite, priority safety > nav)
#   /cmd_vel_smoothed      <- velocity_smoother -> /whill/controller/cmd_vel

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    # M4-R EKF publishes odom -> base_link at 30 Hz and M6R-2 localizer
    # publishes map -> odom at ~10 Hz. transform_tolerance = 0.3 s covers
    # three localizer frames. The M5-c value of 0.5 was sized for the
    # live FAST-LIO ~7 Hz rate and is now unnecessarily loose.
    transform_tolerance: 0.3
    # Canonical Nav2 humble plugin set. The default BT XML files
    # bt_navigator loads (navigate_to_pose + navigate_through_poses,
    # both with replanning + recovery) reference nodes scattered
    # across all of these libraries — trimming the list (e.g. removing
    # RemovePassedGoals) makes the XML loader throw at activate time
    # and the lifecycle bringup aborts. Match nav2_bringup verbatim.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # 2026-07-21 field: 7号館前で goal 手前 0.30m・yaw ずれ 66° のまま、
      # その場で右回転左回転を 40s 繰り返した (前進 4%、angular.z 15回反転)。
      # 位置は 0.25m を僅かに超え、かつ向きも合わず、「位置微修正 → 行き過ぎ →
      # 逆回転 → また位置合わせ」の終端振動に陥っていた。配車は「その地点に
      # 十分近づけば到着」で足り、到着時の向きは指定しない (任意地点配車も
      # yaw=0 固定で送っている)。そこで:
      #  - xy を 0.25 → 0.5 に緩め、あと数 cm を詰める微修正を止める
      #  - yaw を実質不問 (π) にし、終端の rotate-to-heading 振動を根絶する
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 3.15
      stateful: true

    FollowPath:
      # Regulated Pure Pursuit — simpler to reason about than DWB for the
      # chair and handles diff-drive-style motion well, matching WHILL's
      # two-rear-wheel drive. ADR-0010 records the selection.
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # RPP in humble does NOT enforce max_linear_accel itself — it just
      # commands desired_linear_vel directly, causing a 0 → target step on
      # the cmd_vel topic. The chair felt this as a dangerous lurch on the
      # first live M5-d. Real acceleration limiting now happens in
      # velocity_smoother below; these RPP values stay conservative so even
      # if the smoother is bypassed the target speed is gentle.
      desired_linear_vel: 0.3
      max_linear_accel: 0.3          # documentation only (see comment above).
      max_linear_decel: 0.6
      # 0.6 → 0.8 (2026-07-16 field). Under 0.6 the RPP carrot sat close
      # enough to the chair that small heading errors produced visible
      # steering oscillation on straight segments. 0.8 damped the
      # oscillation without hurting corner convergence. min / max stay
      # 0.3 / 0.9 because use_velocity_scaled_lookahead_dist clamps
      # around that range; only the base value shifted.
      lookahead_dist: 0.8
      # 0.3 → 0.6 (2026-07-19 field, bag 解析 #101). desired_linear_vel 0.3 は
      # 実走では ~0.28 m/s に落ち、use_velocity_scaled_lookahead_dist が
      # 実効 lookahead を 0.28 * lookahead_time 1.5 = 0.42 m まで縮めていた。
      # 実測: 直進中 angular.z RMS 0.462, 蛇行周期 2.1s, 空間波長 0.58m,
      # cross-track RMS 5cm/最大14cm。波長 0.58m ≒ 実効 lookahead 0.42m で
      # Pure Pursuit の追従振動 (carrot 追い越し) の典型。vx と |angular.z| の
      # 相関 -0.82 (揺れると減速) も自励振動を裏づける。min を 0.6 に上げて
      # 低速でも実効 lookahead が波長を上回るようにする (0.6 > 0.58)。
      # 次回実機で単独 A/B (この 1 変更のみ) で効果確認する。
      min_lookahead_dist: 0.6
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      # 0.8 → 0.4 (2026-07-22 field, seimon-stall bag 解析)。塗り漏斗で停滞した
      # 際、rotate-to-heading が wz ±0.6-0.8 で回頭 → WHILL の yaw 応答遅れで
      # 目標方位を通り過ぎ → 逆回頭、を ~5 s 周期で 78 回反転するハンチングを
      # 実測 (vx は 105 s 中 41% が 0)。指令 0.65 rad/s × 4 s = 150° 相当に対し
      # 実 yaw 変化は ~50° で、車体が指令に全く追従できていない。回頭速度を
      # 半減してオーバーシュートを抑える。45° 誤差の回頭は ~2 s → progress
      # checker の 10 s 猶予内に収まる。環境側の根本対策 (塗り拡幅) と併用。
      rotate_to_heading_angular_vel: 0.4
      transform_tolerance: 0.3       # matches bt_navigator, see comment above.
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      # Enabled by M6R4-3 (2026-07-16 field). Preconditions cleared:
      #   - obstacle_layer publishes with Patchwork++ upstream (ADR-0011,
      #     PR #83) + M6R4-c min_height 0.05 (PR #84, ADR-0009 accepted)
      #   - M5-R campus map has salt cleaned by Task #13 (PR #88,
      #     map_variant:=cleaned)
      #   - failsafe_node Layer C (perception heartbeat, this PR) catches
      #     a patchworkpp_node crash within ~2 s so a silent /scan cannot
      #     drive the chair through stale obstacle_layer cells
      # RPP carrot lookahead now blocks against lethal cells so the chair
      # brakes on obstacles instead of running them over. Recovery
      # (spin / backup / wait) fires only if the chair truly cannot make
      # progress — the operator with joystick sits above this per ADR-0007
      # §Demo-scope reduction.
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false         # The chair has no rear obstacle awareness yet.
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 10.0
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      # rolling_window keeps the local costmap centered on the chair.
      # global_frame is map (not odom) because the static map is what
      # local plans need to reason about at planning horizon.
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      # 6 → 10 (2026-07-16 field). At 6 m rolling window the cells past
      # the trailing edge froze as ghost lethals (chair moved past an
      # obstacle but the shifted-out cell still read occupied for the
      # planner). 10 m gives ~4 s of forward horizon at 0.3 m/s plus
      # enough trailing buffer that the clearing raytrace stays visible
      # to global_costmap between updates. planner_frequency stayed at
      # the desired 1.0 Hz target after the enlargement.
      width: 10
      height: 10
      resolution: 0.05
      # Circumscribed radius around base_link. The actual chair is roughly
      # 1.0 m long × 0.6 m wide; a 0.45 m circle conservatively covers it.
      # Switch to a polygon footprint once we have a URDF with measured
      # extents.
      robot_radius: 0.45
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      # M6R4-2: /scan (reliable) is published by the
      # pointcloud_to_laserscan bridge launched in nav_launch.py.
      # raytrace_max_range = 25.0 matches p2ls range_max so a cell
      # observed at 25 m clears when the ray sees through it later.
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: base_link
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 25.0
          raytrace_min_range: 0.0
          obstacle_max_range: 20.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 経緯: 3.0 (初期) → 6.0 (07-20, 左偏り是正) → 4.0 (07-21, 端クリアランス)。
        # 07-21 field: cost_scaling 6.0 + inflation_radius 0.4 の組合せで NavFn
        # 経路が走行可能域の端まで最小 0.25m しか離れず (robot_radius 0.45 未満)、
        # 路面端付近の goal で「余裕なし」と判定され abort した。原因は
        # (a) inflation_radius 0.4 < robot_radius 0.45 で、障害物 0.4-0.45m の
        # 帯が「inflation コスト無しだが車体は当たる」死角になっていた、
        # (b) cost_scaling 6.0 の急勾配で端近傍もすぐ低コスト化し最短経路が端を
        # 這った。→ cost_scaling を 4.0 に下げてコストの丘を広げ経路を中央寄りに。
        # 6.0 で直した左偏りが部分再燃しうるが、左偏りは見た目、端這いは abort
        # という機能障害なので後者を優先。左偏りは実機で再確認。
        cost_scaling_factor: 4.0
        # 0.4 → 0.6 (07-21). robot_radius 0.45 を超えるまで拡げ、footprint が
        # inflation 帯に完全に収まる + マージン。経路が端から離れる主因。
        inflation_radius: 0.6

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.45
      # obstacle_layer を除去 (2026-07-20 field). 旧構成は global にも動的
      # obstacle_layer を入れており、歩行者/自転車が通過して marking した
      # lethal が「その場所をセンサが raytrace で再貫通するまで」消えず、
      # マップ全体固定の global に残像として累積した (RViz で確認: 狭い
      # 7号館前で水色 inflation の残像が道の両側から道幅を塞ぎ、最終的に
      # GridBased: failed to create plan で goal 失敗)。標準の Nav2 構成に
      # 合わせ、global は静的地図での経路計画に専念させ、動的回避は local
      # costmap の obstacle_layer (rolling window。通過後に自動消去) に委ねる。
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # global と同値 (3.0→6.0→4.0)。経路計画は global 側だが local も揃える。
        cost_scaling_factor: 4.0
        # global と同値 (0.5→0.4→0.6, 07-21)。端クリアランス確保。詳細は global 側。
        inflation_radius: 0.6

map_server:
  ros__parameters:
    use_sim_time: false
    # yaml_filename is injected at launch from nav_launch.py so this file
    # stays host-portable. nav_launch resolves docs/maps/<site>/occupancy.yaml
    # from the `site` launch argument (default: campus).
    yaml_filename: ""

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
      # The M5-R campus map is outer-loop-only; the ~200 m x 200 m
      # centre is unknown (docs/maps/campus/README.md §2). Setting
      # allow_unknown: false prevents the planner from cutting through
      # never-observed centre cells to shorten a route. ADR-0010 records
      # the choice; revisit once a v2 campus map fills the interior.
      allow_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3           # matches bt_navigator.
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

# velocity_smoother subscribes /cmd_vel (twist_mux output, M6R-3 lite)
# and publishes /cmd_vel_smoothed, which nav_launch.py remaps to
# /whill/controller/cmd_vel. RPP does not ramp velocity itself so
# without the smoother the chair sees a 0 -> 0.3 m/s step on each new
# path segment. OPEN_LOOP feedback means the smoother integrates
# commanded velocity through its own accel limits without needing
# odometry to close the loop.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    # 2026-07-16 field: vyaw_max 0.8 → 0.5. The 0.8 cap turned out to be
    # the dominant source of straight-segment weaving — angular
    # commands maxed at 0.8 rad/s produced overshoot that fed the next
    # correction. 0.5 tames the yaw slew rate without disabling
    # rotate-to-heading behaviour (rotate_to_heading_angular_vel stays
    # 0.8 because in-place rotation was not misbehaving). Empirically
    # adopted on the final field drive; morning V0 sanity-checks the
    # straight-line behaviour before running V1-V6.
    max_velocity: [0.3, 0.0, 0.5]       # [vx_max, vy_max, vyaw_max], matches RPP desired_linear_vel.
    min_velocity: [-0.1, 0.0, -0.8]     # small reverse band for backup recovery.
    max_accel: [0.3, 0.0, 1.0]          # 0.3 m/s² forward — ~1 s to reach 0.3 m/s.
    max_decel: [-0.5, 0.0, -1.0]        # faster decel than accel for safety.
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
