# pointcloud_to_laserscan bridge for the Nav2 obstacle_layer (M6R4-2).
#
# nav2_costmap_2d's ObstacleLayer in humble expects observation sources at
# reliable QoS, but /velodyne_points is best-effort sensor QoS. Running
# pointcloud_to_laserscan_node here republishes as reliable /scan and
# collapses the ring point cloud to a single 2D ring at chair height.
# ADR-0009 records the parameter selection.
#
# Height band updated for M6R4-c: the input is now
# /velodyne_points_no_ground (Patchwork++ output, ADR-0011) instead of the
# raw driver cloud, so `min_height` no longer has to hide sloped-ground
# false lethals. Relaxing it back toward 0.05 m restores curb capture
# (~0.15 m) and pedestrian legs down to knee height.
#
# TENTATIVE (draft): min_height = 0.05 m. Field A/B against 0.10 m is
# planned for 2026-07-14 evening or 2026-07-15 morning (two p2ls
# instances side-by-side, one at each value). The winning value stays
# committed before this PR (m6r/4c) is ready-ed. Rationale on both
# sides is in the PR body.
#
# Historical (kept for context):
#   - 2026-07-14 Phase B set min_height = 0.25 m as a workaround for the
#     2D-slice-on-terrain-flat false lethals (docs/decisions/0009).
#   - ADR-0011 landed the Patchwork++ preprocessor, moving the workaround
#     upstream and freeing min_height to relax again.
#
# Other params:
#   - base_link is at floor level (ground plane), publisher: static_tf_launch
#   - velodyne sits ~0.9 m above base_link on the WHILL chassis
#   - max_height = 1.6 m keeps a standing person's torso + head, drops
#     indoor ceiling returns
#   - range_min 0.5 m avoids WHILL chassis self-return (within 0.5 m of
#     the LiDAR origin)
#   - range_max 25.0 m matches obstacle_layer.raytrace_max_range so
#     "seen and cleared" cells are consistent between p2ls and Nav2
#
# Do not tighten range_min below 0.5 m without re-verifying: the WHILL
# chassis top plate sits inside 0.5 m of the sensor origin and returns
# to itself; a smaller range_min re-introduces self-reflections that get
# marked as obstacles under the chair.

/**:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.1
    min_height: 0.05
    max_height: 1.6
    angle_min: -3.141592
    angle_max:  3.141592
    # 0.5 deg per beam — matches VLP-16 horizontal resolution at 10 Hz
    # rotation, so we don't average across rays we didn't actually see.
    angle_increment: 0.008726646
    scan_time: 0.1
    range_min: 0.5
    # Match obstacle_layer.raytrace_max_range in nav2_params.yaml so a
    # ray that clears an obstacle out to 25 m does clear the cell — a
    # shorter scan range here would leave stale cells around the chair.
    range_max: 25.0
    use_inf: true
    inf_epsilon: 1.0
