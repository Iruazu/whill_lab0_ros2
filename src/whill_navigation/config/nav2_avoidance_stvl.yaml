        voxel_decay: 15.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: lidar_mark lidar_clear depth_mark depth_clear
        lidar_mark:
          data_type: PointCloud2
          topic: /perception/lidar_obstacles_filtered
          sensor_frame: velodyne_hires
          marking: true
          clearing: false
          obstacle_range: 10.0      # replanning horizon (NavFn 1 Hz) beyond the local window
          min_obstacle_height: -50.0
          max_obstacle_height: 50.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: passthrough
          voxel_min_points: 0
          clear_after_reading: true
        lidar_clear:
          data_type: PointCloud2
          topic: /perception/lidar_obstacles_filtered
          sensor_frame: velodyne_hires
          marking: false
          clearing: true
          min_z: 0.0
          max_z: 10.0
          vertical_fov_angle: 0.349
          vertical_fov_padding: 0.05
